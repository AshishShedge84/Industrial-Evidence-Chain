name: industrial-evidence-chain-network

networks:
  evidence-net:
    name: evidence-net

volumes:
  orderer.industrialchain.internal:
  peer0.org1.industrialchain.internal:
  ca.org1.industrialchain.internal:

services:
  ca.org1.industrialchain.internal:
    image: hyperledger/fabric-ca:1.5.11
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ca.org1.industrialchain.internal:/etc/hyperledger/fabric-ca-server
    container_name: ca.org1.industrialchain.internal
    networks:
      - evidence-net

  orderer.industrialchain.internal:
    image: hyperledger/fabric-orderer:2.5.8
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - orderer.industrialchain.internal:/var/hyperledger/production/orderer
    container_name: orderer.industrialchain.internal
    networks:
      - evidence-net

  peer0.org1.industrialchain.internal:
    image: hyperledger/fabric-peer:2.5.8
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=evidence-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_ID=peer0.org1.industrialchain.internal
      - CORE_PEER_ADDRESS=peer0.org1.industrialchain.internal:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.industrialchain.internal:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.industrialchain.internal:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.industrialchain.internal:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    ports:
      - "7051:7051"
    volumes:
      - peer0.org1.industrialchain.internal:/var/hyperledger/production
      - //var/run/docker.sock:/host/var/run/docker.sock
    container_name: peer0.org1.industrialchain.internal
    networks:
      - evidence-net
